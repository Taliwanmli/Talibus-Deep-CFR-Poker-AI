name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eval/requirements.txt
            .github/workflows/python-ci.yml

      - name: Install test dependencies
        run: |
          python -m pip install -r eval/requirements.txt
          python -m pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip check

      - name: Validate Python source
        run: python -m compileall -q training/deep_cfr eval run_eval_suite.py

      - name: Check command-line entry points
        run: |
          python run_eval_suite.py --help
          python -m eval.run_league --help
          python training/deep_cfr/run_deep_cfr.py --help

      - name: Run evaluation tests
        run: python -m unittest discover eval

      - name: Run training loader tests
        run: python -m unittest discover -s training/deep_cfr -p "test_*.py"
